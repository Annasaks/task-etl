name: ETL Pipeline

# Triggered:
#   - daily at 06:00 UTC (07:00 / 08:00 Paris depending on DST)
#   - manually via "Run workflow" button on Actions tab
on:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run ETL pipeline
        env:
          # API keys
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # Pipeline scope
          LEAGUE_ID_API_SPORTS: 39
          LEAGUE_ID_API_FOOTBALL: 152
          SEASON: 2023
          # Load to BigQuery
          LOAD_BACKEND: bigquery
          BIGQUERY_PROJECT: task-etlv
          BIGQUERY_DATASET_API_SPORTS: api_sports_data
          BIGQUERY_DATASET_API_FOOTBALL: api_football_data
          BIGQUERY_LOCATION: US
        run: python main.py

      - name: Upload pipeline artifacts (logs + CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-artifacts-${{ github.run_id }}
          path: |
            logs/etl.log
            data/exports/*.csv
          retention-days: 14
